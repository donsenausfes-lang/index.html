<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Битва за Мир — Все Страны</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #1a1a2e; color: #fff; display: flex; justify-content: center; padding: 10px; min-height: 100vh; }
  .game { max-width: 1300px; width: 100%; }
  .top-bar { display: flex; gap: 10px; margin-bottom: 10px; }
  .player-panel { flex: 1; background: #16213e; border-radius: 12px; padding: 12px; border: 2px solid #0f3460; }
  .player-panel.p1 { border-color: #e94560; }
  .player-panel.p2 { border-color: #2d6a9f; }
  .player-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
  .money { font-size: 20px; color: #f4c542; font-weight: bold; }
  .hint { font-size: 11px; color: #aaa; margin-top: 3px; }
  #map-container { position: relative; width: 100%; background: #0a0a1a; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  #mapSvg { width: 100%; height: auto; display: block; background: #0a1628; }
  .country { stroke: #1a1a2e; stroke-width: 0.4px; cursor: pointer; transition: fill 0.2s; }
  .country:hover { opacity: 0.75; }
  .country.owner-0 { fill: #2a2a3e; }
  .country.owner-1 { fill: #e94560; }
  .country.owner-2 { fill: #2d6a9f; }
  .city-marker { stroke: #fff; stroke-width: 1.5px; cursor: pointer; transition: 0.2s; }
  .city-marker:hover { stroke: #f4c542; stroke-width: 2.5px; }
  .city-label { font-size: 8px; fill: #fff; pointer-events: none; opacity: 0.8; }
  .tooltip { position: absolute; background: rgba(15, 52, 96, 0.97); border: 1px solid #f4c542; border-radius: 6px; padding: 6px 10px; font-size: 12px; pointer-events: none; display: none; z-index: 100; white-space: nowrap; }
  .actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #ff6b81; }
  .btn-secondary { background: #2d6a9f; color: #fff; }
  .btn-secondary:hover:not(:disabled) { background: #3d8ac9; }
  .btn-gold { background: #f4c542; color: #1a1a2e; }
  .btn-gold:hover:not(:disabled) { background: #ffd966; }
  .shop { margin-top: 10px; background: #16213e; border-radius: 12px; padding: 15px; display: flex; gap: 15px; flex-wrap: wrap; }
  .shop-item { background: #1a1a2e; border-radius: 8px; padding: 10px; min-width: 150px; flex: 1; }
  .shop-item h4 { font-size: 13px; margin-bottom: 5px; color: #f4c542; }
  .shop-item p { font-size: 11px; color: #aaa; margin-bottom: 8px; }
  .unit-icon { font-size: 32px; display: block; margin: 5px 0; }
  .log { margin-top: 10px; background: #16213e; border-radius: 12px; padding: 12px; max-height: 100px; overflow-y: auto; font-size: 12px; color: #ccc; }
  .log div { margin-bottom: 3px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #16213e; border-radius: 16px; padding: 25px; max-width: 550px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 15px; color: #f4c542; }
  .country-option { display: block; width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #1a1a2e; border: 2px solid #555; border-radius: 10px; color: #fff; cursor: pointer; text-align: left; font-size: 13px; }
  .country-option:hover { border-color: #f4c542; }
  .country-option.selected { border-color: #e94560; background: #3e1620; }
  .country-option .flag { font-size: 22px; margin-right: 10px; }
  .turn-indicator { text-align: center; padding: 8px; background: #0f3460; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
  .search-box { width: 100%; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #555; background: #1a1a2e; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<div class="game">
  <div class="turn-indicator" id="turnIndicator">Ход игрока 1</div>
  <div class="top-bar">
    <div class="player-panel p1" id="panel1">
      <div class="player-name">🌍 <span id="p1Name">—</span></div>
      <div class="money" id="p1Money">💰 0</div>
      <div class="hint">Ходов: <span id="p1Actions">3</span>/3 · Доход: <span id="p1Income">+0</span>/сек</div>
    </div>
    <div class="player-panel p2" id="panel2">
      <div class="player-name">🌍 <span id="p2Name">—</span></div>
      <div class="money" id="p2Money">💰 0</div>
      <div class="hint">Ходов: <span id="p2Actions">3</span>/3 · Доход: <span id="p2Income">+0</span>/сек</div>
    </div>
  </div>
  <div id="map-container">
    <svg id="mapSvg"></svg>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="actions" id="actions"></div>
  <div class="shop">
    <div class="shop-item">
      <h4>🚶 Пехота</h4>
      <span class="unit-icon" id="infIcon">🚶</span>
      <p>Ур. <span id="infLvl">1</span> · Сила: <span id="infPower">10</span></p>
      <button class="btn-secondary" onclick="upgradeUnit('infantry')">Улучшить (💰50)</button>
    </div>
    <div class="shop-item">
      <h4>🛡️ Танки</h4>
      <span class="unit-icon" id="tankIcon">🛡️</span>
      <p>Ур. <span id="tankLvl">1</span> · Сила: <span id="tankPower">25</span></p>
      <button class="btn-secondary" onclick="upgradeUnit('tank')">Улучшить (💰100)</button>
    </div>
    <div class="shop-item">
      <h4>✈️ Авиация</h4>
      <span class="unit-icon" id="airIcon">✈️</span>
      <p>Ур. <span id="airLvl">1</span> · Сила: <span id="airPower">40</span></p>
      <button class="btn-secondary" onclick="upgradeUnit('air')">Улучшить (💰150)</button>
    </div>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="modal-bg" id="countryModal">
  <div class="modal">
    <h3 id="countryTitle">Игрок 1, выбери страну:</h3>
    <input class="search-box" id="countrySearch" placeholder="Поиск страны..." oninput="filterCountries()">
    <div id="countryList"></div>
    <button class="btn-gold" style="width:100%;margin-top:10px" onclick="confirmCountry()">Подтвердить</button>
  </div>
</div>

<div class="modal-bg" id="cityModal">
  <div class="modal">
    <h3 id="cityTitle">Страна/Город</h3>
    <div id="cityInfo" style="margin-bottom:15px;color:#ccc;font-size:14px"></div>
    <div id="cityActions"></div>
    <button class="btn-gold" style="width:100%;margin-top:15px" onclick="closeModal('cityModal')">Закрыть</button>
  </div>
</div>
<script>
// ===== ДАННЫЕ ВСЕХ СТРАН =====
let ALL_COUNTRIES = [];
let COUNTRY_MAP = {};

const state = {
  phase: "pick",
  pickingPlayer: 1,
  selectedPick: null,
  currentPlayer: 1,
  players: {
    1: { country: null, money: 500, income: 5, actions: 3, units: { infantry: 1, tank: 1, air: 1 }, unitLevels: { infantry: 1, tank: 1, air: 1 } },
    2: { country: null, money: 500, income: 5, actions: 3, units: { infantry: 1, tank: 1, air: 1 }, unitLevels: { infantry: 1, tank: 1, air: 1 } },
  },
  territories: {},
  playerCountryIso: { 1: null, 2: null },
  cities: [],
  tickInterval: null,
  geoData: null,
  projection: null,
  pathGenerator: null,
  svg: null,
};
  // ===== ЗАГРУЗКА ДАННЫХ =====
async function loadAllData() {
  try {
    const resp = await fetch('https://cdn.jsdelivr.net/npm/world-countries@4.0.0/countries.json');
    ALL_COUNTRIES = await resp.json();
    
    ALL_COUNTRIES.forEach(c => {
      COUNTRY_MAP[c.cca3] = c;
      COUNTRY_MAP[c.ccn3] = c;
      COUNTRY_MAP[c.cca2] = c;
    });
    
    const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    state.geoData = topojson.feature(world, world.objects.countries).features;
    
    state.cities = ALL_COUNTRIES
      .filter(c => c.capitalInfo && c.capitalInfo.latlng && c.capitalInfo.latlng.length === 2)
      .map(c => ({
        name: c.capital[0],
        countryIso: c.cca3,
        countryName: c.translations?.rus?.common || c.name.common,
        lat: c.capitalInfo.latlng[0],
        lon: c.capitalInfo.latlng[1],
        isCapital: true,
      }));
    
    console.log(`Загружено: ${ALL_COUNTRIES.length} стран, ${state.cities.length} городов`);
    initGame();
  } catch (e) {
    console.error("Ошибка загрузки:", e);
    alert("Ошибка загрузки данных. Проверь интернет.");
  }
      }
  // ===== ИНИЦИАЛИЗАЦИЯ КАРТЫ =====
function initGame() {
  const container = document.getElementById("map-container");
  const width = container.clientWidth;
  const height = width * 0.5;
  
  const svg = d3.select("#mapSvg").attr("viewBox", `0 0 ${width} ${height}`);
  state.svg = svg;
  
  state.projection = d3.geoMercator().scale(width / 6.5).translate([width / 2, height / 2]);
  state.pathGenerator = d3.geoPath().projection(state.projection);
  
  svg.selectAll("path.country")
    .data(state.geoData)
    .enter()
    .append("path")
    .attr("class", "country owner-0")
    .attr("d", state.pathGenerator)
    .attr("data-iso", d => d.id)
    .attr("data-name", d => d.properties.name)
    .on("click", (event, d) => clickCountry(d))
    .on("mouseover", (event, d) => showTooltip(event, d))
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseout", () => hideTooltip());
  
  renderCities();
  
  state.geoData.forEach(f => {
    state.territories[f.id] = 0;
  });
  
  renderCountryPicker();
  document.getElementById("countryModal").style.display = "flex";
}

function renderCities() {
  const svg = state.svg;
  
  svg.selectAll("circle.city-marker")
    .data(state.cities)
    .enter()
    .append("circle")
    .attr("class", "city-marker")
    .attr("cx", d => {
      const p = state.projection([d.lon, d.lat]);
      return p ? p[0] : -100;
    })
    .attr("cy", d => {
      const p = state.projection([d.lon, d.lat]);
      return p ? p[1] : -100;
    })
    .attr("r", 4)
    .attr("fill", d => {
      const owner = state.territories[getIsoByCca3(d.countryIso)] || 0;
      return owner === 1 ? "#e94560" : owner === 2 ? "#2d6a9f" : "#f4c542";
    })
    .on("click", (event, d) => clickCityMarker(d))
    .on("mouseover", (event, d) => showCityTooltip(event, d))
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseout", () => hideTooltip());
  
  svg.selectAll("text.city-label")
    .data(state.cities)
    .enter()
    .append("text")
    .attr("class", "city-label")
    .attr("x", d => {
      const p = state.projection([d.lon, d.lat]);
      return p ? p[0] + 6 : -100;
    })
    .attr("y", d => {
      const p = state.projection([d.lon, d.lat]);
      return p ? p[1] + 3 : -100;
    })
    .text(d => d.name);
}
  // ===== ВСПОМОГАТЕЛЬНЫЕ =====
function getIsoByCca3(cca3) {
  const c = COUNTRY_MAP[cca3];
  return c ? c.ccn3 : null;
}

function getCountryNameByIso(iso) {
  for (const key in COUNTRY_MAP) {
    if (COUNTRY_MAP[key].ccn3 === iso) {
      return COUNTRY_MAP[key].translations?.rus?.common || COUNTRY_MAP[key].name.common;
    }
  }
  return "Неизвестно";
}

function getDefense(iso) {
  const owner = state.territories[iso] || 0;
  const cityCount = state.cities.filter(c => getIsoByCca3(c.countryIso) === iso).length;
  return 25 + (owner !== 0 ? 15 : 0) + cityCount * 3;
}
  // ===== ВЫБОР СТРАНЫ =====
function renderCountryPicker() {
  const list = document.getElementById("countryList");
  const title = document.getElementById("countryTitle");
  const p = state.pickingPlayer;
  title.textContent = `Игрок ${p}, выбери страну:`;
  
  const taken = state.players[3 - p].country?.cca3;
  
  const sorted = [...ALL_COUNTRIES].sort((a, b) => {
    const na = a.translations?.rus?.common || a.name.common;
    const nb = b.translations?.rus?.common || b.name.common;
    return na.localeCompare(nb);
  });
  
  list.innerHTML = sorted.map(c => {
    const name = c.translations?.rus?.common || c.name.common;
    const disabled = taken === c.cca3;
    const selected = state.selectedPick === c.cca3;
    return `<button class="country-option ${selected ? 'selected' : ''}" 
      ${disabled ? 'disabled' : ''} 
      onclick="pickCountry('${c.cca3}')">
      <span class="flag">${c.flag}</span>${name}
      ${disabled ? '<span style="color:#e94560;font-size:11px">занято</span>' : ''}
    </button>`;
  }).join("");
}

function filterCountries() {
  const q = document.getElementById("countrySearch").value.toLowerCase();
  const buttons = document.querySelectorAll("#countryList .country-option");
  buttons.forEach(b => {
    b.style.display = b.textContent.toLowerCase().includes(q) ? "block" : "none";
  });
}

function pickCountry(cca3) {
  state.selectedPick = cca3;
  renderCountryPicker();
}

function confirmCountry() {
  if (!state.selectedPick) return alert("Выбери страну!");
  
  const country = COUNTRY_MAP[state.selectedPick];
  const p = state.pickingPlayer;
  state.players[p].country = country;
  state.playerCountryIso[p] = country.ccn3;
  state.territories[country.ccn3] = p;
  state.players[p].income += 10;
  
  if (p === 1) {
    state.pickingPlayer = 2;
    state.selectedPick = null;
    renderCountryPicker();
  } else {
    document.getElementById("countryModal").style.display = "none";
    state.phase = "playing";
    state.currentPlayer = 1;
    state.selectedPick = null;
    updateUI();
    updateMapColors();
    updateCityColors();
    renderActions();
    startTicking();
    log("Игра началась! Игрок 1 ходит первым.");
  }
}
  // ===== ОБНОВЛЕНИЕ =====
function updateMapColors() {
  d3.selectAll("path.country").attr("class", d => {
    const owner = state.territories[d.id] || 0;
    return `country owner-${owner}`;
  });
}

function updateCityColors() {
  d3.selectAll("circle.city-marker").attr("fill", d => {
    const iso = getIsoByCca3(d.countryIso);
    const owner = state.territories[iso] || 0;
    return owner === 1 ? "#e94560" : owner === 2 ? "#2d6a9f" : "#f4c542";
  });
}

function updateUI() {
  for (let p = 1; p <= 2; p++) {
    const pl = state.players[p];
    const name = pl.country ? (pl.country.translations?.rus?.common || pl.country.name.common) : "—";
    document.getElementById(`p${p}Name`).textContent = pl.country ? `${pl.country.flag} ${name}` : "—";
    document.getElementById(`p${p}Money`).textContent = `💰 ${pl.money}`;
    document.getElementById(`p${p}Actions`).textContent = pl.actions;
    document.getElementById(`p${p}Income`).textContent = `+${pl.income}`;
    document.getElementById(`panel${p}`).style.opacity = (state.currentPlayer === p) ? "1" : "0.6";
  }
  
  document.getElementById("turnIndicator").textContent = 
    state.phase === "playing" ? `🎮 Ход игрока ${state.currentPlayer}` : "Выбор стран...";
  
  const cp = state.currentPlayer;
  const pl = state.players[cp];
  document.getElementById("infLvl").textContent = pl.unitLevels.infantry;
  document.getElementById("infPower").textContent = 10 * pl.unitLevels.infantry;
  document.getElementById("tankLvl").textContent = pl.unitLevels.tank;
  document.getElementById("tankPower").textContent = 25 * pl.unitLevels.tank;
  document.getElementById("airLvl").textContent = pl.unitLevels.air;
  document.getElementById("airPower").textContent = 40 * pl.unitLevels.air;
  
  document.getElementById("infIcon").textContent = pl.unitLevels.infantry >= 3 ? "🪖" : "🚶";
  document.getElementById("tankIcon").textContent = pl.unitLevels.tank >= 3 ? "🚀" : "🛡️";
  document.getElementById("airIcon").textContent = pl.unitLevels.air >= 3 ? "🛩️" : "✈️";
}

function renderActions() {
  const actions = document.getElementById("actions");
  const p = state.currentPlayer;
  const pl = state.players[p];
  actions.innerHTML = `
    <button class="btn-gold" onclick="skipTurn()" ${pl.actions <= 0 ? 'disabled' : ''}>
      ⏭️ Пропустить ход (+${pl.income * 5}💰, -1 ход)
    </button>
    <button class="btn-secondary" onclick="endTurn()">Завершить ход (осталось ${pl.actions})</button>
  `;
}
  // ===== ТУЛТИПЫ =====
function showTooltip(event, d) {
  const tooltip = document.getElementById("tooltip");
  const owner = state.territories[d.id] || 0;
  const ownerName = owner === 0 ? "Нейтральная" : `Игрок ${owner}`;
  tooltip.innerHTML = `<b>${getCountryNameByIso(d.id)}</b><br>Владелец: ${ownerName}`;
  tooltip.style.display = "block";
}

function showCityTooltip(event, d) {
  const tooltip = document.getElementById("tooltip");
  const iso = getIsoByCca3(d.countryIso);
  const owner = state.territories[iso] || 0;
  tooltip.innerHTML = `<b>${d.name}</b><br>${d.countryName} · Владелец: ${owner === 0 ? "Нейтрал" : "Игрок " + owner}`;
  tooltip.style.display = "block";
}

function moveTooltip(event) {
  const tooltip = document.getElementById("tooltip");
  const container = document.getElementById("map-container").getBoundingClientRect();
  tooltip.style.left = (event.clientX - container.left + 15) + "px";
  tooltip.style.top = (event.clientY - container.top + 15) + "px";
}

function hideTooltip() {
  document.getElementById("tooltip").style.display = "none";
  }
  // ===== КЛИК ПО СТРАНЕ =====
function clickCountry(d) {
  if (state.phase !== "playing") return;
  const iso = d.id;
  const name = getCountryNameByIso(iso);
  const owner = state.territories[iso] || 0;
  const p = state.currentPlayer;
  const pl = state.players[p];
  const defense = getDefense(iso);
  const cityCount = state.cities.filter(c => getIsoByCca3(c.countryIso) === iso).length;
  
  document.getElementById("cityTitle").textContent = name;
  document.getElementById("cityInfo").innerHTML = `
    Владелец: <b>${owner === 0 ? "Нейтральная" : "Игрок " + owner}</b><br>
    🛡️ Сила обороны: <b style="color:#f4c542">${defense}</b><br>
    🏙️ Городов на территории: ${cityCount}
  `;
  
  const box = document.getElementById("cityActions");
  box.innerHTML = "";
  
  if (owner === p) {
    box.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:8px">Произвести войска:</p>
      <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('infantry',${n})">🚶×${n} (${n*20}💰)</button>`).join("")}
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('tank',${n})">🛡️×${n} (${n*50}💰)</button>`).join("")}
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('air',${n})">✈️×${n} (${n*80}💰)</button>`).join("")}
      </div>
      <button class="btn-secondary" style="width:100%" onclick="fortifyCountry('${iso}')" ${pl.actions <= 0 ? 'disabled' : ''}>
        🛡️ Укрепить (+15 защиты, -1 ход)
      </button>
    `;
  } else {
    const attackPower = pl.units.infantry * 10 * pl.unitLevels.infantry + pl.units.tank * 25 * pl.unitLevels.tank;
    const canWin = attackPower >= defense;
    
    box.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:12px">
        ${owner === 0 ? "Нейтральная территория" : "Территория Игрока " + owner}
      </p>
      <button 
        onclick="startWar('${iso}', ${defense})" 
        ${pl.actions <= 0 ? 'disabled' : ''}
        style="
          width:100%;
          padding:16px;
          background:${pl.actions <= 0 ? '#555' : '#8B0000'};
          color:#fff;
          border:none;
          border-radius:12px;
          font-size:16px;
          font-weight:bold;
          cursor:${pl.actions <= 0 ? 'not-allowed' : 'pointer'};
          letter-spacing:1px;
          box-shadow:0 4px 12px rgba(139,0,0,0.4);
          transition:0.2s;
        "
      >
        ⚔️ НАЧАТЬ ВОЙНУ
      </button>
      <p style="font-size:11px;color:#888;margin-top:8px;text-align:center">
        Твоя сила: <b style="color:${canWin ? '#4caf50' : '#e94560'}">${attackPower}</b> · 
        Оборона: <b style="color:#f4c542">${defense}</b>
      </p>
    `;
  }
  
  document.getElementById("cityModal").style.display = "flex";
}

// ===== КЛИК ПО ГОРОДУ =====
function clickCityMarker(city) {
  if (state.phase !== "playing") return;
  const iso = getIsoByCca3(city.countryIso);
  const owner = state.territories[iso] || 0;
  const p = state.currentPlayer;
  const pl = state.players[p];
  
  const defense = 20 + (owner !== 0 ? 10 : 0) + (city.isCapital ? 15 : 0);
  
  document.getElementById("cityTitle").textContent = city.name;
  document.getElementById("cityInfo").innerHTML = `
    Страна: <b>${city.countryName}</b><br>
    Владелец: <b>${owner === 0 ? "Нейтрал" : "Игрок " + owner}</b><br>
    🛡️ Сила города: <b style="color:#f4c542;font-size:18px">${defense}</b>
  `;
  
  const box = document.getElementById("cityActions");
  box.innerHTML = "";
  
  if (owner === p) {
    box.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:8px">Производство в городе:</p>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('infantry',${n})">🚶×${n} (${n*20}💰)</button>`).join("")}
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('tank',${n})">🛡️×${n} (${n*50}💰)</button>`).join("")}
        ${[1,2,3].map(n => `<button class="btn-primary" onclick="produceUnits('air',${n})">✈️×${n} (${n*80}💰)</button>`).join("")}
      </div>
      <button class="btn-secondary" style="width:100%;margin-top:10px" onclick="fortifyCountry('${iso}')" ${pl.actions <= 0 ? 'disabled' : ''}>
        🛡️ Укрепить город (+15, -1 ход)
      </button>
    `;
  } else {
    const attackPower = pl.units.infantry * 10 * pl.unitLevels.infantry + pl.units.tank * 25 * pl.unitLevels.tank;
    const canWin = attackPower >= defense;
    
    box.innerHTML = `
      <p style="font-size:13px;color:#aaa;margin-bottom:12px">
        ${owner === 0 ? "Нейтральный город" : "Город Игрока " + owner}
      </p>
      <button 
        onclick="startWar('${iso}', ${defense}, '${city.name}')" 
        ${pl.actions <= 0 ? 'disabled' : ''}
        style="
          width:100%;
          padding:16px;
          background:${pl.actions <= 0 ? '#555' : '#8B0000'};
          color:#fff;
          border:none;
          border-radius:12px;
          font-size:16px;
          font-weight:bold;
          cursor:${pl.actions <= 0 ? 'not-allowed' : 'pointer'};
          letter-spacing:1px;
          box-shadow:0 4px 12px rgba(139,0,0,0.4);
          transition:0.2s;
        "
      >
        ⚔️ НАЧАТЬ ВОЙНУ
      </button>
      <p style="font-size:11px;color:#888;margin-top:8px;text-align:center">
        Твоя сила: <b style="color:${canWin ? '#4caf50' : '#e94560'}">${attackPower}</b> · 
        Оборона: <b style="color:#f4c542">${defense}</b>
      </p>
    `;
  }
  
  document.getElementById("cityModal").style.display = "flex";
}
  // ===== НАЧАЛО ВОЙНЫ =====
function startWar(iso, defense, cityName = null) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  
  if (pl.actions <= 0) return alert("Нет ходов!");
  
  const owner = state.territories[iso] || 0;
  if (owner === p) return alert("Это твоя территория!");
  
  const attackPower = pl.units.infantry * 10 * pl.unitLevels.infantry + pl.units.tank * 25 * pl.unitLevels.tank;
  
  pl.actions--;
  
  const luck = 0.7 + Math.random() * 0.6;
  const finalAttack = Math.floor(attackPower * luck);
  
  const targetName = cityName || getCountryNameByIso(iso);
  
  if (finalAttack >= defense) {
    state.territories[iso] = p;
    pl.units.infantry = Math.max(1, Math.floor(pl.units.infantry * 0.7));
    
    log(`⚔️ ПОБЕДА! Игрок ${p} захватил ${targetName}! (${finalAttack} vs ${defense})`);
    alert(`⚔️ ПОБЕДА!\n\nТы захватил ${targetName}!\n\nТвоя сила: ${finalAttack}\nОборона: ${defense}`);
    recalcIncome();
  } else {
    pl.units.infantry = Math.max(1, Math.floor(pl.units.infantry * 0.5));
    
    log(`❌ ПОРАЖЕНИЕ! Игрок ${p} не взял ${targetName}. (${finalAttack} vs ${defense})`);
    alert(`❌ ПОРАЖЕНИЕ!\n\nТы не смог взять ${targetName}.\n\nТвоя сила: ${finalAttack}\nОборона: ${defense}\n\nПотери: половина пехоты.`);
  }
  
  updateUI();
  updateMapColors();
  updateCityColors();
  renderActions();
  closeModal("cityModal");
}

// ===== ПРОИЗВОДСТВО =====
function produceUnits(type, qty) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  const cost = type === 'infantry' ? 20 : type === 'tank' ? 50 : 80;
  const total = cost * qty;
  
  if (pl.money < total) return alert("Недостаточно денег!");
  pl.money -= total;
  pl.units[type] += qty;
  log(`Игрок ${p} произвёл ${qty} ${type} за ${total}💰`);
  updateUI();
}

function upgradeUnit(type) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  const costs = { infantry: 50, tank: 100, air: 150 };
  if (pl.unitLevels[type] >= 5) return alert("Макс. уровень!");
  if (pl.money < costs[type]) return alert("Недостаточно денег!");
  pl.money -= costs[type];
  pl.unitLevels[type]++;
  log(`Игрок ${p} улучшил ${type} до ур.${pl.unitLevels[type]}`);
  updateUI();
}

function fortifyCountry(iso) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  if (pl.actions <= 0) return alert("Нет ходов!");
  pl.actions--;
  log(`Игрок ${p} укрепил ${getCountryNameByIso(iso)}`);
  updateUI();
  renderActions();
  closeModal("cityModal");
}
  // ===== ХОДЫ =====
function skipTurn() {
  const p = state.currentPlayer;
  const pl = state.players[p];
  if (pl.actions <= 0) return;
  
  const bonus = pl.income * 5;
  pl.money += bonus;
  pl.actions--;
  log(`⏭️ Игрок ${p} пропустил ход и получил ${bonus}💰`);
  updateUI();
  renderActions();
}

function endTurn() {
  const p = state.currentPlayer;
  state.currentPlayer = 3 - p;
  state.players[state.currentPlayer].actions = 3;
  log(`--- Ход Игрока ${state.currentPlayer} ---`);
  updateUI();
  renderActions();
}

function recalcIncome() {
  for (let p = 1; p <= 2; p++) {
    const owned = Object.values(state.territories).filter(o => o === p).length;
    state.players[p].income = 5 + owned * 2;
  }
  updateUI();
}

function startTicking() {
  if (state.tickInterval) clearInterval(state.tickInterval);
  state.tickInterval = setInterval(() => {
    if (state.phase !== "playing") return;
    for (let p = 1; p <= 2; p++) {
      state.players[p].money += state.players[p].income;
    }
    updateUI();
  }, 3000);
}

function log(msg) {
  const el = document.getElementById("log");
  const div = document.createElement("div");
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

// ===== СТАРТ =====
loadAllData();
</script>
</body>
