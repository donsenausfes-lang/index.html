<style>

  html, body { height: 100%; overflow: hidden; }
  body { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; height: 100vh; width: 100vw; padding-bottom: env(safe-area-inset-bottom); }
  
  .top-bar { display: flex; gap: 4px; padding: 4px 6px; background: #0f0f1e; border-bottom: 1px solid #2a2a3e; flex-shrink: 0; }

  .player-name { font-weight: bold; font-size: 10px; color: #aaa; margin-bottom: 1px; letter-spacing: 0.5px; }
  .money { font-size: 15px; color: #f4c542; font-weight: bold; line-height: 1.1; }
  .hint { font-size: 9px; color: #777; margin-top: 1px; }
  
  #map-container { position: relative; flex: 1; background: #0a0a1a; overflow: hidden; touch-action: none; cursor: grab; min-height: 0; }
  #map-container:active { cursor: grabbing; }
  #mapSvg { width: 100%; height: 100%; display: block; background: #0a1628; }
  .country { stroke: #1a1a2e; stroke-width: 0.4px; cursor: pointer; transition: fill 0.3s; }
  .country:hover { opacity: 0.75; }
  .country.owner-0 { fill: #2a2a3e; }
  .country.owner-1 { fill: #e94560; }
  .country.owner-2 { fill: #2d6a9f; }
  .city-marker { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
  
  .tooltip { position: absolute; background: rgba(15, 52, 96, 0.97); border: 1px solid #f4c542; border-radius: 6px; padding: 6px 10px; font-size: 12px; pointer-events: none; display: none; z-index: 100; white-space: nowrap; }
  
  .bottom-bar { display: flex; gap: 6px; padding: 8px 8px 90px 8px; background: #0f0f1e; border-top: 1px solid #2a2a3e; flex-shrink: 0; }
  .bottom-bar button { flex: 1; padding: 14px 8px; border: none; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; min-height: 48px; }
  .bottom-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-gold { background: #f4c542; color: #1a1a2e; }
  .btn-gold:hover:not(:disabled) { background: #ffd966; }
  .btn-blue { background: #2d6a9f; color: #fff; }
  .btn-blue:hover:not(:disabled) { background: #3d8ac9; }
  
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
  .modal-bg.show { display: flex; }
  .modal { background: #16213e; border-radius: 20px 20px 0 0; padding: 20px 20px 90px 20px; width: 100%; max-height: 85vh; overflow-y: auto; animation: slideUp 0.25s ease-out; position: relative; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h3 { margin-bottom: 15px; color: #f4c542; font-size: 18px; }
  .modal-close { position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: #fff; font-size: 28px; cursor: pointer; padding: 5px 10px; line-height: 1; }
  
  .country-option { display: flex; align-items: center; width: 100%; padding: 10px 12px; margin-bottom: 6px; background: #1a1a2e; border: 2px solid #555; border-radius: 10px; color: #fff; cursor: pointer; text-align: left; font-size: 13px; }
  .country-option:hover { border-color: #f4c542; }
  .country-option.selected { border-color: #e94560; background: #3e1620; }
  .country-option:disabled { opacity: 0.4; }
  .country-option .flag { font-size: 22px; margin-right: 10px; }
  
  .search-box { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #555; background: #1a1a2e; color: #fff; font-size: 14px; }
  
  .shop-item { background: #1a1a2e; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .shop-item-info { flex: 1; }
  .shop-item h4 { font-size: 14px; margin-bottom: 4px; color: #f4c542; }
  .shop-item p { font-size: 11px; color: #aaa; }
  .unit-icon { font-size: 28px; }
  .shop-item button { padding: 10px 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; background: #2d6a9f; color: #fff; cursor: pointer; }
  .shop-item button:disabled { opacity: 0.4; }
  
  .war-btn { width: 100%; padding: 16px; background: #8B0000; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(139,0,0,0.4); transition: 0.2s; }
  .war-btn:hover:not(:disabled) { background: #a00000; }
  .war-btn:disabled { background: #555; cursor: not-allowed; }
  
  .rocket-btn { width: 100%; padding: 14px; background: #6a1b9a; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(106,27,154,0.4); }

  .rocket-btn:disabled { background: #555; cursor: not-allowed; }

    0% { r: 5; opacity: 1; fill: #fff; }

    100% { r: 50; opacity: 0; fill: #ff0000; }
  }
  .explosion { animation: explosion 1s ease-out forwards; }
  
  @keyframes damageFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }

<div class="bottom-bar">

    <div id="cityActions"></div>
  </div>
</div>

<div class="modal-bg" id="shopModal">

  </div>
</div>

async function loadAllData() {
  BUILTIN_COUNTRIES.forEach(c => {
    COUNTRY_MAP[c.cca3] = c;
    COUNTRY_MAP[c.ccn3] = c;
  });
  ALL_COUNTRIES = BUILTIN_COUNTRIES;
  
  const WORLD_URLS = [
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
    "https://unpkg.com/world-atlas@2/countries-110m.json"
  ];
  
  let world = null;
  for (const url of WORLD_URLS) {
    try {
      console.log(`Пробую: ${url}`);
      world = await d3.json(url);
      if (world && world.objects) { console.log(`✅ Карта загружена`); break; }
    } catch (e) { console.log(`❌ ${url}`); }
  }
  
  if (!world) {
    alert("Карта не загрузилась. Включи VPN и обнови страницу.");
    return;
  }
  
  state.geoData = topojson.feature(world, world.objects.countries).features;
  state.geoData = state.geoData.filter(f => f.id !== "010");
  
  state.cities = BUILTIN_COUNTRIES.map(c => ({
    name: c.capital,
    countryIso: c.cca3,
    countryName: c.name,
    lat: c.lat,
    lon: c.lon,
    isCapital: true,
    troops: { infantry: 1, tank: 0, air: 0 },
    owner: 0,
  }));
  
  console.log(`✅ Городов: ${state.cities.length}, регионов: ${state.geoData.length}`);
  initGame();
  }
 let zoomBehavior;

function initGame() {
  const container = document.getElementById("map-container");
  const width = container.clientWidth;
  const height = container.clientHeight;
  
  const svg = d3.select("#mapSvg").attr("viewBox", `0 0 ${width} ${height}`);
  state.svg = svg;
  
  state.projection = d3.geoMercator().scale(width / 7).translate([width / 2, height / 2]);
  state.pathGenerator = d3.geoPath().projection(state.projection);
  
  const g = svg.append("g").attr("class", "zoom-layer");
  state.zoomLayer = g;
  
  g.append("g").attr("class", "rockets-layer");
  
  g.selectAll("path.country")
    .data(state.geoData)
    .enter()
    .append("path")
    .attr("class", "country owner-0")
    .attr("d", state.pathGenerator)
    .attr("data-iso", d => d.id)
    .on("click", (event, d) => clickCountry(d))
    .on("mouseover", (event, d) => showTooltip(event, d))
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseout", () => hideTooltip());
  
  renderCities();
  
  state.geoData.forEach(f => { state.territories[f.id] = 0; });

 function getIsoByCca3(cca3) {
  const c = COUNTRY_MAP[cca3];
  return c ? c.ccn3 : null;
}

function getCountryNameByIso(iso) {
  for (const key in COUNTRY_MAP) {
    if (COUNTRY_MAP[key].ccn3 === iso) return COUNTRY_MAP[key].name;
  }
  return "Неизвестно";
}

function getCityDefense(city) {
  const owner = city.owner || state.territories[getIsoByCca3(city.countryIso)] || 0;
  let base = 20 + (owner !== 0 ? 10 : 0) + (city.isCapital ? 15 : 0);
  base += city.troops.infantry * 5;
  base += city.troops.tank * 15;
  base += city.troops.air * 25;
  return base;
}

function getCountryPower(iso) {
  const cities = state.cities.filter(c => getIsoByCca3(c.countryIso) === iso);
  let power = 0, infantry = 0, tank = 0, air = 0;
  cities.forEach(city => {
    infantry += city.troops.infantry;
    tank += city.troops.tank;
    air += city.troops.air;
    power += getCityDefense(city);
  });
  if (cities.length === 0) power = 25;
  return { power, infantry, tank, air, cityCount: cities.length };
}

function getDistance(city1, city2) {
  const R = 6371;
  const dLat = (city2.lat - city1.lat) * Math.PI / 180;
  const dLon = (city2.lon - city1.lon) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(city1.lat * Math.PI / 180) * Math.cos(city2.lat * Math.PI / 180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getNearestMyCity(targetCity, playerId) {
  const myCities = state.cities.filter(c => c.owner === playerId);
  if (myCities.length === 0) return null;
  let nearest = null, minDist = Infinity;
  myCities.forEach(c => {
    const d = getDistance(c, targetCity);
    if (d < minDist) { minDist = d; nearest = c; }
  });
  return { city: nearest, distance: Math.round(minDist) };
}

function canAttackCity(targetCity, playerId) {
  const player = state.players[playerId];
  const nearest = getNearestMyCity(targetCity, playerId);
  if (!nearest) return { allowed: false, reason: "Нет твоих городов!", distance: 0 };
  const dist = nearest.distance;
  const hasAir = player.units.air > 0;
  if (dist <= 3000) return { allowed: true, reason: "Близко", distance: dist, nearest: nearest.city };
  if (dist <= 8000) {
    if (hasAir) return { allowed: true, reason: `Далеко (${dist} км), есть авиация`, distance: dist, nearest: nearest.city };
    return { allowed: false, reason: `Далеко (${dist} км). Нужна авиация!`, distance: dist, nearest: nearest.city };
  }
  return { allowed: false, reason: `Очень далеко (${dist} км). Только ракеты!`, distance: dist, nearest: nearest.city };
 }

 function startWarCity(cityName) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  if (pl.actions <= 0) return alert("Нет ходов!");
  
  const city = state.cities.find(c => c.name === cityName);
  if (!city) return;
  
  const iso = getIsoByCca3(city.countryIso);
  const owner = city.owner || state.territories[iso] || 0;
  if (owner === p) return;
  
  const check = canAttackCity(city, p);
  if (!check.allowed) return alert(`❌ НЕЛЬЗЯ!\n\n${check.reason}`);
  
  const attackPower = pl.units.infantry * 10 * pl.unitLevels.infantry + pl.units.tank * 25 * pl.unitLevels.tank;
  const defense = getCityDefense(city);
  
  pl.actions--;
  const luck = 0.7 + Math.random() * 0.6;
  const finalAttack = Math.floor(attackPower * luck);
  
  if (finalAttack >= defense) {
    city.owner = p;
    city.troops = { infantry: 1, tank: 0, air: 0 };
    const allCities = state.cities.filter(c => getIsoByCca3(c.countryIso) === iso);
    if (allCities.every(c => c.owner === p)) state.territories[iso] = p;
    
    pl.units.infantry = Math.max(1, Math.floor(pl.units.infantry * 0.7));
    log(`⚔️ Игрок ${p} захватил ${cityName}!`);
    showDamage(city, "⚔️ ЗАХВАТ!", "#4caf50");
    recalcIncome();
  } else {
    city.troops.infantry = Math.max(0, city.troops.infantry - Math.floor(finalAttack / 20));
    pl.units.infantry = Math.max(1, Math.floor(pl.units.infantry * 0.6));
    log(`❌ Игрок ${p} не взял ${cityName}`);
    showDamage(city, "❌ ПРОВАЛ", "#e94560");
  }
  
  updateUI(); updateMapColors(); updateCityColors(); renderActions();
  closeModal("cityModal");
}

function produceInCity(cityName, type, qty) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  const city = state.cities.find(c => c.name === cityName);
  if (!city) return;
  
  const cost = type === 'infantry' ? 20 : type === 'tank' ? 50 : 80;
  const total = cost * qty;
  
  if (pl.money < total) return alert("Недостаточно денег!");
  pl.money -= total;
  city.troops[type] += qty;
  log(`Игрок ${p} произвёл ${qty} ${type} в ${cityName}`);
  updateUI(); updateCityColors();
  clickCityMarker(city);
}

function launchRocket(targetCityName) {
  const p = state.currentPlayer;
  const pl = state.players[p];
  if (pl.rockets <= 0) return alert("Нет ракет!");
  
  const targetCity = state.cities.find(c => c.name === targetCityName);
  if (!targetCity) return;
  
  const nearest = getNearestMyCity(targetCity, p);
  if (!nearest) return alert("Нет твоих городов!");
  
  pl.rockets--;
  closeModal("rocketModal");
  closeModal("cityModal");
  updateUI();
  
  animateRocket(nearest.city, targetCity, () => {
    const hit = Math.random() < 0.5;
    
    if (hit) {
      const iso = getIsoByCca3(targetCity.countryIso);
      const owner = targetCity.owner || state.territories[iso] || 0;
      
      if (owner !== p) {
        targetCity.troops.infantry = Math.max(0, targetCity.troops.infantry - 5);
        targetCity.troops.tank = Math.max(0, targetCity.troops.tank - 2);
        
        log(`🚀 ПОПАДАНИЕ! Ракета Игрока ${p} ударила по ${targetCity.name}!`);
        showExplosion(targetCity);
        showDamage(targetCity, "💥 -5🚶 -2🛡️", "#ff6600");
        
        if (targetCity.troops.infantry === 0 && targetCity.troops.tank === 0 && targetCity.troops.air === 0) {
          targetCity.owner = p;
          targetCity.troops = { infantry: 1, tank: 0, air: 0 };
          log(`🏴 ${targetCity.name} уничтожен и захвачен!`);
          recalcIncome();
        }
      }
    } else {
      log(`🚫 Ракета Игрока ${p} по ${targetCity.name} СБИТА!`);
      showDamage(targetCity, "🚫 СБИТА", "#888");
    }
    
    updateUI(); updateMapColors(); updateCityColors(); renderActions();
  });
}

function animateRocket(fromCity, toCity, onComplete) {
  const fromPos = state.projection([fromCity.lon, fromCity.lat]);
  const toPos = state.projection([toCity.lon, toCity.lat]);
  
  if (!fromPos || !toPos) return onComplete();
  
  const rocketsLayer = state.zoomLayer.select("g.rockets-layer");
  
  const trail = rocketsLayer.append("line")
    .attr("class", "rocket-trail")
    .attr("x1", fromPos[0]).attr("y1", fromPos[1])
    .attr("x2", toPos[0]).attr("y2", toPos[1])
    .attr("stroke", "#ff6600")
    .attr("stroke-width", 2)
    .attr("stroke-dasharray", "8,6")
    .style("opacity", 0.9);
  
  const rocket = rocketsLayer.append("circle")
    .attr("class", "rocket-dot")
    .attr("r", 6)
    .attr("fill", "#fff")
    .attr("stroke", "#ff6600")
    .attr("stroke-width", 2)
    .attr("cx", fromPos[0])
    .attr("cy", fromPos[1]);
  
  const rocketIcon = rocketsLayer.append("text")
    .attr("font-size", "16px")
    .attr("text-anchor", "middle")
    .attr("x", fromPos[0])
    .attr("y", fromPos[1] - 12)
    .text("🚀");
  
  const duration = 1500;
  const startTime = Date.now();
  
  function step() {
    const t = Math.min((Date.now() - startTime) / duration, 1);
    const easeT = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
    
    const x = fromPos[0] + (toPos[0] - fromPos[0]) * easeT;
    const y = fromPos[1] + (toPos[1] - fromPos[1]) * easeT;
    const arcHeight = 50 * Math.sin(Math.PI * easeT);
    
    rocket.attr("cx", x).attr("cy", y - arcHeight);
    rocketIcon.attr("x", x).attr("y", y - arcHeight - 10);
    
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      rocket.remove();
      rocketIcon.remove();
      trail.transition().duration(300).style("opacity", 0).remove();
      onComplete();
    }
  }
  
  step();
}

function showExplosion(city) {
  const pos = state.projection([city.lon, city.lat]);
  if (!pos) return;
  
  const rocketsLayer = state.zoomLayer.select("g.rockets-layer");
  
  const circle = rocketsLayer.append("circle")
    .attr("cx", pos[0])
    .attr("cy", pos[1])
    .attr("r", 5)
    .attr("fill", "#fff")
    .attr("opacity", 1)
    .attr("class", "explosion");
  
  setTimeout(() => circle.remove(), 1100);
}

function showDamage(city, text, color) {
  const pos = state.projection([city.lon, city.lat]);
  if (!pos) return;
  
  const rocketsLayer = state.zoomLayer.select("g.rockets-layer");
  
  const textEl = rocketsLayer.append("text")
    .attr("class", "damage-text")
    .attr("x", pos[0])
    .attr("y", pos[1] - 15)
    .attr("text-anchor", "middle")
    .attr("fill", color)
    .attr("stroke", "#000")
    .attr("stroke-width", "0.5px")
    .attr("paint-order", "stroke")
    .text(text);
  
  setTimeout(() => textEl.remove(), 1600);
 }
 function skipTurn() {
  const p = state.currentPlayer;
  const pl = state.players[p];
  if (pl.actions <= 0) return alert("Нет ходов!");
  const bonus = pl.income * 5;
  pl.money += bonus;
  pl.actions--;
  log(`⏭️ Игрок ${p} пропустил ход (+${bonus}💰)`);
  updateUI(); renderActions();
}

function endTurn() {
  const p = state.currentPlayer;
  state.currentPlayer = 3 - p;
  state.players[state.currentPlayer].actions = 3;
  log(`--- Ход Игрока ${state.currentPlayer} ---`);
  updateUI(); renderActions();
}

function recalcIncome() {
  for (let p = 1; p <= 2; p++) {
    const ownedCities = state.cities.filter(c => c.owner === p).length;
    const ownedCountries = Object.values(state.territories).filter(o => o === p).length;
    state.players[p].income = 5 + ownedCities * 3 + ownedCountries * 2;
  }
  updateUI();
}

function startTicking() {
  if (state.tickInterval) clearInterval(state.tickInterval);
  state.tickInterval = setInterval(() => {
    if (state.phase !== "playing") return;
    for (let p = 1; p <= 2; p++) state.players[p].money += state.players[p].income;
    updateUI();
  }, 3000);
}

function log(msg) {
  const el = document.getElementById("logPanel");
  const div = document.createElement("div");
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function toggleLog() { document.getElementById("logPanel").classList.toggle("show"); }

function closeModal(id) { document.getElementById(id).classList.remove("show"); }

loadAllData();
